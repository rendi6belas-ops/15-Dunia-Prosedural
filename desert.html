<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Mirage</title>
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
html{background:#05070a}
body{
  margin:0;overflow:hidden;background:#05070a;color:#eef4f8;
  font:400 16px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;
  touch-action:none;
}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
canvas.drag{cursor:grabbing}

.hud{position:fixed;inset:0;pointer-events:none;z-index:2;
  transition:opacity .9s ease}
.hud.dim{opacity:.32}
.hud:hover{opacity:1}

.title-block{position:absolute;left:clamp(18px,4vw,58px);bottom:clamp(20px,6vh,64px);
  max-width:min(46ch,72vw);transition:opacity 1s ease,transform 1s ease}
.kicker{display:flex;align-items:center;gap:.7em;margin-bottom:.85em;
  font:600 10.5px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.32em;text-transform:uppercase;color:var(--ac);opacity:.95}
.kicker::after{content:"";flex:1;height:1px;min-width:28px;
  background:linear-gradient(90deg,var(--ac),transparent);opacity:.5}
h1{margin:0;font:800 clamp(30px,5.4vw,64px)/0.98 ui-sans-serif,system-ui,sans-serif;
  letter-spacing:-.025em;text-wrap:balance;
  text-shadow:0 2px 30px rgba(0,0,0,.75),0 1px 2px rgba(0,0,0,.9)}
p.sub{margin:.6em 0 0;max-width:38ch;font-size:clamp(12px,1.15vw,15px);line-height:1.65;
  color:#eef4f8;opacity:.68;text-shadow:0 1px 12px rgba(0,0,0,.9)}

.hint{position:absolute;left:50%;bottom:clamp(14px,3vh,26px);transform:translateX(-50%);
  display:flex;flex-wrap:wrap;justify-content:center;gap:.45em 1.1em;
  font:500 10px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.18em;text-transform:uppercase;color:#cfdae2;opacity:.55;
  white-space:nowrap;padding:0 12px;text-align:center}
.hint b{display:inline-block;padding:.25em .45em;margin-right:.4em;border-radius:3px;
  background:rgba(255,255,255,.12);color:#fff;font-weight:600;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}

.index{position:absolute;top:clamp(16px,3.4vh,30px);right:clamp(16px,3vw,38px);
  font:500 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.28em;
  color:#cfdae2;opacity:.5;text-transform:uppercase}

.err{position:fixed;inset:auto 16px 16px 16px;z-index:9;display:none;
  max-height:46vh;overflow:auto;padding:14px 16px;border-radius:8px;
  background:rgba(24,4,6,.94);box-shadow:0 0 0 1px #ff5e5b88,0 18px 40px #000a;
  font:500 12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;
  color:#ffd9d7;white-space:pre-wrap}

.veil{position:fixed;inset:0;z-index:3;background:#05070a;pointer-events:none;
  transition:opacity 1.4s ease}
.veil.gone{opacity:0}
.loader{position:fixed;inset:0;z-index:4;display:grid;place-content:center;
  font:600 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.4em;color:var(--ac);
  text-transform:uppercase;transition:opacity .7s ease}
.loader.gone{opacity:0}

@media (max-width:640px){
  .hint{font-size:9px;letter-spacing:.12em}
  p.sub{font-size:12px}
}

</style>
</head>
<body style="--ac:#ffd08a">
<canvas id="c"></canvas>
<div class="veil" id="veil"></div>
<div class="loader" id="loader">memuat</div>
<div class="hud" id="hud">
  <div class="index">06 / 15</div>
  <div class="title-block">
    <div class="kicker">Gurun · Oasis</div>
    <h1>Mirage</h1>
    <p class="sub">Air di tengah bukit pasir. Yang membuatnya bertahan bukan hujan, tapi lapisan batuan di bawah yang menahan rembesan.</p>
  </div>
  <div class="hint"><b>drag</b>lihat <b>W A S D</b>gerak <b>shift</b>cepat <b>H</b>sembunyikan</div>
</div>
<pre class="err" id="err"></pre>
<script>window.SCENE={fragSrc:"#version 300 es\nprecision highp float;\nprecision highp int;\nuniform vec2 uRes;\nuniform float uTime;\nuniform vec3 uCamPos;\nuniform vec3 uCamFwd;\nuniform vec3 uCamRight;\nuniform vec3 uCamUp;\nuniform vec2 uMouse;\nout vec4 fragColor;\n\n// Shared GLSL library. Every scene declares its own `float map(vec3)` and\n// `vec3 render(vec3 ro, vec3 rd)`; everything else comes from here.\nfloat map(vec3 p);\nvec3 render(vec3 ro, vec3 rd);\n\n#define PI 3.14159265359\n#define TAU 6.28318530718\n\nfloat hash11(float p){ p = fract(p*0.1031); p *= p+33.33; p *= p+p; return fract(p); }\nfloat hash21(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*0.1031); p3 += dot(p3, p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }\nfloat hash31(vec3 p3){ p3 = fract(p3*0.1031); p3 += dot(p3, p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }\nvec3 hash33(vec3 p3){ p3 = fract(p3*vec3(0.1031,0.1030,0.0973)); p3 += dot(p3, p3.yxz+33.33); return fract((p3.xxy+p3.yxx)*p3.zyx); }\n\nfloat vnoise(vec3 p){\n  vec3 i = floor(p);\n  vec3 f = fract(p);\n  f = f*f*(3.0-2.0*f);\n  float n000 = hash31(i);\n  float n100 = hash31(i+vec3(1.0,0.0,0.0));\n  float n010 = hash31(i+vec3(0.0,1.0,0.0));\n  float n110 = hash31(i+vec3(1.0,1.0,0.0));\n  float n001 = hash31(i+vec3(0.0,0.0,1.0));\n  float n101 = hash31(i+vec3(1.0,0.0,1.0));\n  float n011 = hash31(i+vec3(0.0,1.0,1.0));\n  float n111 = hash31(i+vec3(1.0,1.0,1.0));\n  return mix(mix(mix(n000,n100,f.x), mix(n010,n110,f.x), f.y),\n             mix(mix(n001,n101,f.x), mix(n011,n111,f.x), f.y), f.z);\n}\nfloat fbm(vec3 p){ float a = 0.5, s = 0.0; for(int i=0;i<5;i++){ s += a*vnoise(p); p = p*2.03+vec3(17.1,31.7,5.3); a *= 0.5; } return s; }\nfloat fbm3(vec3 p){ float a = 0.5, s = 0.0; for(int i=0;i<3;i++){ s += a*vnoise(p); p = p*2.07+vec3(7.3,13.9,3.1); a *= 0.5; } return s; }\nfloat ridged(vec3 p){ float a = 0.5, s = 0.0; for(int i=0;i<4;i++){ s += a*(1.0-abs(vnoise(p)*2.0-1.0)); p = p*2.05+vec3(5.2,9.1,2.7); a *= 0.5; } return s; }\n\nmat2 rot2(float a){ float c = cos(a), s = sin(a); return mat2(c,-s,s,c); }\nmat3 rotY(float a){ float c = cos(a), s = sin(a); return mat3(c,0.0,-s, 0.0,1.0,0.0, s,0.0,c); }\n\nfloat smin(float a, float b, float k){ float h = clamp(0.5+0.5*(b-a)/k, 0.0, 1.0); return mix(b,a,h) - k*h*(1.0-h); }\nfloat smax(float a, float b, float k){ return -smin(-a,-b,k); }\n\nfloat sdSphere(vec3 p, float r){ return length(p)-r; }\nfloat sdBox(vec3 p, vec3 b){ vec3 q = abs(p)-b; return length(max(q,0.0)) + min(max(q.x,max(q.y,q.z)),0.0); }\nfloat sdBox2(vec2 p, vec2 b){ vec2 q = abs(p)-b; return length(max(q,0.0)) + min(max(q.x,q.y),0.0); }\nfloat sdCyl(vec3 p, float r, float h){ vec2 d = abs(vec2(length(p.xz),p.y)) - vec2(r,h); return min(max(d.x,d.y),0.0) + length(max(d,0.0)); }\nfloat sdCapsule(vec3 p, vec3 a, vec3 b, float r){ vec3 pa = p-a, ba = b-a; float h = clamp(dot(pa,ba)/max(dot(ba,ba),1e-4),0.0,1.0); return length(pa-ba*h)-r; }\nfloat sdTorus(vec3 p, vec2 t){ vec2 q = vec2(length(p.xz)-t.x, p.y); return length(q)-t.y; }\nfloat sdOcta(vec3 p, float s){ p = abs(p); return (p.x+p.y+p.z-s)*0.57735027; }\nfloat sdPlane(vec3 p, float h){ return p.y-h; }\n\nfloat march(vec3 ro, vec3 rd, float tmax, int steps, out bool hit){\n  float t = 0.0;\n  hit = false;\n  for(int i=0;i<192;i++){\n    if(i >= steps) break;\n    float d = map(ro + rd*t);\n    if(d < 0.0013*max(t, 0.6)){ hit = true; break; }\n    t += d*0.82;\n    if(t > tmax) break;\n  }\n  return min(t, tmax);\n}\n\nvec3 calcNormal(vec3 p, float e){\n  vec2 h = vec2(e, 0.0);\n  return normalize(vec3(map(p+h.xyy)-map(p-h.xyy),\n                        map(p+h.yxy)-map(p-h.yxy),\n                        map(p+h.yyx)-map(p-h.yyx)));\n}\n\nfloat softShadow(vec3 ro, vec3 rd, float mint, float maxt, float k){\n  float res = 1.0, t = mint;\n  for(int i=0;i<48;i++){\n    float h = map(ro + rd*t);\n    res = min(res, k*h/t);\n    if(res < 0.01 || t > maxt) break;\n    t += clamp(h, 0.03, 0.45);\n  }\n  return clamp(res, 0.0, 1.0);\n}\n\nfloat calcAO(vec3 p, vec3 n){\n  float occ = 0.0, sca = 1.0;\n  for(int i=0;i<5;i++){\n    float h = 0.02 + 0.14*float(i);\n    float d = map(p + n*h);\n    occ += (h-d)*sca;\n    sca *= 0.85;\n  }\n  return clamp(1.0 - 1.7*occ, 0.0, 1.0);\n}\n\nvec3 tonemap(vec3 x){\n  x = max(x, 0.0);\n  return (x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14);\n}\n\n// Cheap analytic caustic pattern, used by the water scenes.\nfloat caustic(vec2 uv, float t){\n  vec2 p = uv*1.4;\n  float v = 0.0;\n  for(int i=0;i<3;i++){\n    p = rot2(0.7 + float(i)*0.9)*p;\n    v += 1.0/(0.35 + abs(sin(p.x + t*0.9)*sin(p.y*1.17 - t*0.7))*2.2);\n  }\n  return clamp(v*0.22, 0.0, 1.6);\n}\n\n\n#define SUN normalize(vec3(-0.30, 0.40, 0.86))\n#define WATERY -0.42\n\nfloat terrain(vec3 p){\n  float d = fbm3(p*0.06) - 0.5;\n  float h = 3.2*d;\n  float crest = fbm3(p*0.115 + 4.0);\n  h += 4.0*pow(max(crest - 0.44, 0.0), 1.5);\n  h += 0.09*sin(p.x*1.5 + fbm3(p*0.45)*6.0)*smoothstep(0.42, 0.85, crest);\n  h += 0.18*(fbm3(p*0.85) - 0.5);\n  float basin = exp(-dot(p.xz, p.xz)*0.030);\n  h = mix(h, -1.15, smoothstep(0.05, 0.72, basin));\n  return h;\n}\n\nfloat palm(vec3 p, vec2 c, float lean){\n  vec3 q = p - vec3(c.x, 0.0, c.y);\n  float trunk = sdCapsule(q, vec3(0.0,-0.6,0.0), vec3(lean, 4.1, lean*0.6), 0.085);\n  vec3 top = q - vec3(lean, 4.25, lean*0.6);\n  float crown = sdSphere(top*vec3(1.0,0.34,1.0), 1.30) - 0.30*fbm3(top*2.2);\n  return min(trunk, crown*0.85);\n}\n\nfloat map(vec3 p){\n  float d = (p.y - terrain(p))*0.55;\n  float water = max(p.y - WATERY, length(p.xz) - 9.6);\n  d = min(d, water);\n  d = min(d, palm(p, vec2(6.6, 2.2), 0.55));\n  d = min(d, palm(p, vec2(-5.4, 4.6), -0.45));\n  d = min(d, palm(p, vec2(3.2, -7.4), 0.65));\n  d = min(d, palm(p, vec2(-7.6, -3.4), -0.55));\n  d = min(d, palm(p, vec2(1.2, 8.6), 0.20));\n  return d;\n}\n\nvec3 skyCol(vec3 rd){\n  float up = max(rd.y, 0.0);\n  vec3 col = mix(vec3(0.50,0.60,0.70), vec3(0.05,0.20,0.48), smoothstep(0.0, 0.70, up));\n  float sd = max(dot(rd, SUN), 0.0);\n  col += vec3(1.0,0.84,0.58)*pow(sd, 5.0)*0.40;\n  col += vec3(1.0,0.97,0.88)*pow(sd, 1800.0)*9.0;\n  return col;\n}\n\nvec3 render(vec3 ro, vec3 rd){\n  bool hit;\n  float t = march(ro, rd, 130.0, 132, hit);\n  vec3 col = skyCol(rd);\n\n  if(hit){\n    vec3 p = ro + rd*t;\n    vec3 n = calcNormal(p, max(0.006, 0.0018*t));\n    float ao = calcAO(p, n);\n    float sh = softShadow(p + n*0.05, SUN, 0.08, 24.0, 15.0);\n    float dif = clamp(dot(n, SUN)*0.95 + 0.05, 0.0, 1.0);\n\n    float isWater = step(abs(p.y - WATERY), 0.05)*step(length(p.xz), 9.62);\n    float isFoliage = smoothstep(0.9, 2.2, p.y);\n\n    vec3 sand = mix(vec3(0.78,0.58,0.35), vec3(0.92,0.76,0.52), fbm3(p*0.55));\n    sand = mix(sand, vec3(0.62,0.42,0.26), smoothstep(0.55, 0.95, fbm3(p*0.16))*0.55);\n    vec3 leaf = mix(vec3(0.05,0.13,0.045), vec3(0.18,0.30,0.08), fbm3(p*3.0));\n    vec3 bark = vec3(0.22,0.16,0.10);\n    vec3 alb = mix(mix(sand, bark, isFoliage*0.55), leaf, isFoliage*isFoliage);\n\n    vec3 amb = mix(vec3(0.05,0.05,0.06), vec3(0.16,0.20,0.28), n.y*0.5 + 0.5);\n    col = alb*(amb*ao*1.2 + dif*sh*vec3(1.0,0.90,0.72)*1.10);\n\n    if(isWater > 0.5){\n      float r1 = fbm3(vec3(p.xz*2.4, uTime*0.30));\n      float r2 = fbm3(vec3(p.xz*2.4 + 9.0, uTime*0.26));\n      vec3 nn = normalize(vec3((r1 - 0.5)*0.55, 1.0, (r2 - 0.5)*0.55));\n      float fres = pow(1.0 - max(dot(nn, -rd), 0.0), 4.0);\n      vec3 refl = skyCol(reflect(rd, nn));\n      vec3 deep = mix(vec3(0.06,0.20,0.20), vec3(0.02,0.09,0.10), fbm3(p*0.5));\n      col = mix(deep, refl, 0.30 + 0.62*fres);\n      float spec = pow(max(dot(reflect(rd, nn), SUN), 0.0), 260.0);\n      col += vec3(1.0,0.95,0.82)*spec*3.0;\n    }\n\n    float fogAmt = 1.0 - exp(-t*0.006);\n    col = mix(col, mix(vec3(0.58,0.52,0.42), vec3(0.30,0.34,0.42), 0.4), fogAmt);\n  }\n  return col;\n}\n\n\nvoid main(){\n  vec2 uv = (gl_FragCoord.xy - 0.5*uRes) / uRes.y;\n  vec3 ro = uCamPos;\n  vec3 rd = normalize(uCamFwd*1.55 + uCamRight*uv.x + uCamUp*uv.y);\n  vec3 col = render(ro, rd);\n  col = tonemap(col*1.06);\n  col = pow(max(col, vec3(0.0)), vec3(0.4545));\n  float vig = smoothstep(1.28, 0.34, length(uv));\n  col *= mix(0.66, 1.0, vig);\n  col += (hash21(gl_FragCoord.xy + fract(uTime)*97.0) - 0.5)*0.014;\n  fragColor = vec4(col, 1.0);\n}\n",cam:{"pos":[0,2.2,-3],"yaw":-0.05,"pitch":-0.02,"speed":3.4,"clampY":1.4,"spin":0.02}};</script>
<script>(function(){
  "use strict";
  var S = window.SCENE;
  var cvs = document.getElementById("c");
  var errEl = document.getElementById("err");
  var loader = document.getElementById("loader");
  var hud = document.getElementById("hud");
  var veil = document.getElementById("veil");

  function fail(msg){
    window.__err = String(msg);
    errEl.style.display = "block";
    errEl.textContent = String(msg);
    if(loader) loader.classList.add("gone");
  }

  var gl = cvs.getContext("webgl2", {alpha:false, antialias:false, depth:false, stencil:false, powerPreference:"high-performance"});
  if(!gl){
    fail("WebGL2 tidak tersedia. Buka dengan Chrome / Edge / Firefox versi terbaru.");
    return;
  }

  function compile(type, src, label){
    var sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if(!gl.getShaderParameter(sh, gl.COMPILE_STATUS)){
      var log = gl.getShaderInfoLog(sh) || "unknown error";
      fail(label + " gagal dikompilasi:\n" + log);
      return null;
    }
    return sh;
  }

  var VS = "#version 300 es\nin vec2 aPos;\nvoid main(){ gl_Position = vec4(aPos, 0.0, 1.0); }";
  var vs = compile(gl.VERTEX_SHADER, VS, "Vertex shader");
  var fs = compile(gl.FRAGMENT_SHADER, S.fragSrc, "Fragment shader");
  if(!vs || !fs) return;

  var prog = gl.createProgram();
  gl.attachShader(prog, vs);
  gl.attachShader(prog, fs);
  gl.bindAttribLocation(prog, 0, "aPos");
  gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog, gl.LINK_STATUS)){
    fail("Program gagal di-link:\n" + (gl.getProgramInfoLog(prog) || ""));
    return;
  }
  gl.useProgram(prog);

  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  function U(n){ return gl.getUniformLocation(prog, n); }
  var uRes = U("uRes"), uTime = U("uTime"), uCamPos = U("uCamPos"),
      uCamFwd = U("uCamFwd"), uCamRight = U("uCamRight"), uCamUp = U("uCamUp"),
      uMouse = U("uMouse");

  // ---------- camera ----------
  var cam = S.cam || {};
  var state = {
    yaw: cam.yaw || 0,
    pitch: cam.pitch || 0,
    pos: (cam.pos || [0,1.6,-4]).slice(),
    tgtYaw: cam.yaw || 0,
    tgtPitch: cam.pitch || 0
  };
  var speed = cam.speed || 4.0;
  var clampY = (typeof cam.clampY === "number") ? cam.clampY : -1e4;
  var spin = cam.spin || 0;
  var idle = 999;

  function sub(a,b){ return [a[0]-b[0], a[1]-b[1], a[2]-b[2]]; }
  function cross(a,b){ return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]; }
  function nrm(a){ var l = Math.hypot(a[0],a[1],a[2]) || 1; return [a[0]/l, a[1]/l, a[2]/l]; }

  var fwd = [0,0,1], right = [1,0,0], up = [0,1,0];

  function basis(){
    var cp = Math.cos(state.pitch), sp = Math.sin(state.pitch);
    fwd = [Math.sin(state.yaw)*cp, sp, Math.cos(state.yaw)*cp];
    right = nrm(cross(fwd, [0,1,0]));
    up = cross(right, fwd);
  }

  // ---------- input ----------
  var keys = Object.create(null);
  var dragging = false, lastX = 0, lastY = 0, pointers = 0;

  function look(dx, dy){
    state.tgtYaw -= dx*0.0032;
    state.tgtPitch = Math.max(-1.45, Math.min(1.45, state.tgtPitch - dy*0.0032));
    idle = 0;
  }

  cvs.addEventListener("pointerdown", function(e){
    cvs.setPointerCapture(e.pointerId);
    dragging = true; pointers++;
    lastX = e.clientX; lastY = e.clientY;
    cvs.classList.add("drag");
    idle = 0;
  });
  cvs.addEventListener("pointermove", function(e){
    if(dragging && e.pointerType !== "touch"){
      look(e.clientX-lastX, e.clientY-lastY);
      lastX = e.clientX; lastY = e.clientY;
    } else if(dragging && pointers === 1){
      look(e.clientX-lastX, e.clientY-lastY);
      lastX = e.clientX; lastY = e.clientY;
    }
  });
  window.addEventListener("pointerup", function(){
    dragging = false; pointers = Math.max(0, pointers-1);
    cvs.classList.remove("drag");
  });
  window.addEventListener("pointercancel", function(){ dragging = false; pointers = 0; cvs.classList.remove("drag"); });

  window.addEventListener("wheel", function(e){
    e.preventDefault();
    var d = Math.max(-4, Math.min(4, e.deltaY*0.004))*speed*0.35;
    state.pos[0] += fwd[0]*d; state.pos[1] += fwd[1]*d; state.pos[2] += fwd[2]*d;
    idle = 0;
  }, {passive:false});

  window.addEventListener("keydown", function(e){
    keys[e.code] = true;
    if(e.code === "KeyH"){
      if(hud) hud.classList.toggle("dim");
    }
    if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].indexOf(e.code) >= 0) e.preventDefault();
  });
  window.addEventListener("keyup", function(e){ keys[e.code] = false; });
  window.addEventListener("contextmenu", function(e){ e.preventDefault(); });
  window.addEventListener("blur", function(){ keys = Object.create(null); dragging = false; });

  // ---------- sizing ----------
  var q = 1.0, cssW = 1, cssH = 1, curW = 0, curH = 0;
  function resize(){
    var dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    cssW = cvs.clientWidth || window.innerWidth;
    cssH = cvs.clientHeight || window.innerHeight;
    var w = Math.max(2, Math.round(cssW*dpr*q));
    var h = Math.max(2, Math.round(cssH*dpr*q));
    if(w === curW && h === curH) return;
    curW = w; curH = h;
    cvs.width = w; cvs.height = h;
    gl.viewport(0, 0, w, h);
  }
  window.addEventListener("resize", resize);

  // ---------- loop ----------
  var t = 0, avg = 16, last = performance.now(), frames = 0;

  function frame(now){
    var raw = (now - last)/1000;
    last = now;
    var dt = Math.min(0.06, Math.max(0.001, raw));
    t += dt;
    frames++;
    idle += dt;

    avg = avg*0.92 + Math.min(200, raw*1000)*0.08;
    if(avg > 52 && q > 0.52){ q = Math.max(0.52, q-0.06); resize(); avg = 34; }
    else if(avg < 23 && q < 1.0){ q = Math.min(1.0, q+0.03); resize(); avg = 26; }

    if(!dragging && idle > 2.5 && spin) state.tgtYaw += spin*dt;

    var kx = (keys.KeyD?1:0) - (keys.KeyA?1:0);
    var kz = (keys.KeyW?1:0) - (keys.KeyS?1:0);
    var ky = (keys.KeyE?1:0) - (keys.KeyQ?1:0);
    var sprint = (keys.ShiftLeft || keys.ShiftRight) ? 2.4 : 1.0;
    if(kx || kz || ky){
      var s = speed*sprint*dt;
      state.pos[0] += (fwd[0]*kz + right[0]*kx)*s;
      state.pos[1] += (fwd[1]*kz + ky)*s;
      state.pos[2] += (fwd[2]*kz + right[2]*kx)*s;
      idle = 0;
    }
    if(state.pos[1] < clampY) state.pos[1] = clampY;

    state.yaw += (state.tgtYaw - state.yaw)*Math.min(1, dt*14);
    state.pitch += (state.tgtPitch - state.pitch)*Math.min(1, dt*14);
    basis();

    gl.uniform2f(uRes, curW, curH);
    gl.uniform1f(uTime, t);
    gl.uniform3f(uCamPos, state.pos[0], state.pos[1], state.pos[2]);
    gl.uniform3f(uCamFwd, fwd[0], fwd[1], fwd[2]);
    gl.uniform3f(uCamRight, right[0], right[1], right[2]);
    gl.uniform3f(uCamUp, up[0], up[1], up[2]);
    gl.uniform2f(uMouse, lx, ly);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    if(frames === 2){
      window.__ready = true;
      if(loader) loader.classList.add("gone");
      if(veil) veil.classList.add("gone");
      setTimeout(function(){ if(hud) hud.classList.add("dim"); }, 9000);
    }
    requestAnimationFrame(frame);
  }

  var lx = 0.5, ly = 0.5;
  window.addEventListener("pointermove", function(e){
    lx = e.clientX/Math.max(1, window.innerWidth);
    ly = 1 - e.clientY/Math.max(1, window.innerHeight);
  });

  resize();
  requestAnimationFrame(frame);

  window.addEventListener("error", function(e){ fail(e.message || "runtime error"); });
})();
</script>
</body>
</html>
